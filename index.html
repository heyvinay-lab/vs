<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Offline Location</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7fb;
        color: #172033;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 430px;
    }

    .card {
        background: white;
        border-radius: 24px;
        padding: 28px;

        box-shadow:
            0 15px 45px rgba(0, 0, 0, 0.10);
    }

    .location-icon {
        width: 64px;
        height: 64px;

        border-radius: 18px;

        background: #e7f0ff;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 32px;

        margin-bottom: 20px;
    }

    h1 {
        margin: 0;

        font-size: 28px;
        font-weight: 700;
    }

    .description {
        margin-top: 10px;
        margin-bottom: 25px;

        color: #6b7585;

        font-size: 16px;
        line-height: 1.5;
    }

    .capture-button {
        width: 100%;

        border: none;
        border-radius: 14px;

        padding: 16px;

        background: #1769e0;
        color: white;

        font-size: 17px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;
    }

    .capture-button:active {
        transform: scale(0.98);
    }

    .capture-button:disabled {
        background: #8aaee5;
        cursor: wait;
    }

    .status {
        margin-top: 18px;

        padding: 15px;

        border-radius: 13px;

        background: #f1f4f8;

        color: #566173;

        font-size: 14px;

        line-height: 1.4;
    }

    .status.success {
        background: #eaf8ef;
        color: #227344;
    }

    .status.error {
        background: #fff0f0;
        color: #b3261e;
    }

    .location-data {
        display: none;

        margin-top: 20px;

        border: 1px solid #e5e9ef;

        border-radius: 16px;

        overflow: hidden;
    }

    .data-row {
        display: flex;

        justify-content: space-between;

        gap: 15px;

        padding: 14px 16px;

        border-bottom: 1px solid #edf0f4;
    }

    .data-row:last-child {
        border-bottom: none;
    }

    .data-label {
        color: #7a8494;
        font-size: 14px;
    }

    .data-value {
        font-size: 14px;
        font-weight: 600;

        text-align: right;

        word-break: break-word;
    }

    .saved-count {
        margin-top: 18px;

        text-align: center;

        color: #697486;

        font-size: 13px;
    }

    .offline-badge {
        display: inline-flex;

        align-items: center;

        gap: 6px;

        margin-bottom: 18px;

        padding: 6px 10px;

        border-radius: 20px;

        background: #f1f4f8;

        color: #667184;

        font-size: 12px;
    }

    .dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: #35a853;
    }
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="location-icon">
            📍
        </div>

        <div class="offline-badge">
            <span class="dot"></span>
            Offline storage enabled
        </div>

        <h1>
            Get My Location
        </h1>

        <p class="description">
            Tap the button to capture your current location.
            Your coordinates are stored on this device and do not
            require mobile data.
        </p>

        <button
            id="captureButton"
            class="capture-button"
            onclick="captureLocation()"
        >
            Capture My Location
        </button>

        <div
            id="status"
            class="status"
        >
            Ready to capture your location.
        </div>

        <div
            id="locationData"
            class="location-data"
        >

            <div class="data-row">
                <span class="data-label">
                    Latitude
                </span>

                <span
                    id="latitude"
                    class="data-value"
                >
                    —
                </span>
            </div>


            <div class="data-row">
                <span class="data-label">
                    Longitude
                </span>

                <span
                    id="longitude"
                    class="data-value"
                >
                    —
                </span>
            </div>


            <div class="data-row">
                <span class="data-label">
                    Accuracy
                </span>

                <span
                    id="accuracy"
                    class="data-value"
                >
                    —
                </span>
            </div>


            <div class="data-row">
                <span class="data-label">
                    Time
                </span>

                <span
                    id="timestamp"
                    class="data-value"
                >
                    —
                </span>
            </div>

        </div>


        <div
            id="savedCount"
            class="saved-count"
        >
            0 location(s) stored on this device
        </div>

    </div>

</div>


<script>

    /*
     * Update number of locations stored locally
     */
    function updateSavedCount() {

        const locations =
            JSON.parse(
                localStorage.getItem("offlineLocations") || "[]"
            );

        document.getElementById("savedCount").textContent =
            locations.length +
            " location(s) stored on this device";
    }


    /*
     * Capture location
     */
    function captureLocation() {

        const button =
            document.getElementById("captureButton");

        const status =
            document.getElementById("status");


        /*
         * Check browser support
         */
        if (!navigator.geolocation) {

            status.textContent =
                "Your browser does not support GPS location.";

            status.className =
                "status error";

            return;
        }


        /*
         * UI while getting location
         */
        button.disabled = true;

        button.textContent =
            "Getting Location...";

        status.textContent =
            "Waiting for the most accurate location available...";

        status.className =
            "status";


        /*
         * Ask phone for location
         */
        navigator.geolocation.getCurrentPosition(

            function(position) {

                const latitude =
                    position.coords.latitude;

                const longitude =
                    position.coords.longitude;

                const accuracy =
                    position.coords.accuracy;

                const timestamp =
                    new Date().toISOString();


                /*
                 * Create location object
                 */
                const location = {

                    latitude: latitude,

                    longitude: longitude,

                    accuracy: accuracy,

                    timestamp: timestamp

                };


                /*
                 * Read previously stored locations
                 */
                const locations =
                    JSON.parse(
                        localStorage.getItem(
                            "offlineLocations"
                        ) || "[]"
                    );


                /*
                 * Add new location
                 */
                locations.push(location);


                /*
                 * Save locally
                 */
                localStorage.setItem(
                    "offlineLocations",
                    JSON.stringify(locations)
                );


                /*
                 * Display location
                 */
                document.getElementById(
                    "latitude"
                ).textContent =
                    latitude.toFixed(7);


                document.getElementById(
                    "longitude"
                ).textContent =
                    longitude.toFixed(7);


                document.getElementById(
                    "accuracy"
                ).textContent =
                    accuracy.toFixed(1) +
                    " meters";


                document.getElementById(
                    "timestamp"
                ).textContent =
                    new Date(timestamp)
                    .toLocaleString();


                /*
                 * Show location card
                 */
                document.getElementById(
                    "locationData"
                ).style.display = "block";


                /*
                 * Success message
                 */
                status.textContent =
                    "Location captured and saved on this device.";

                status.className =
                    "status success";


                /*
                 * Reset button
                 */
                button.disabled = false;

                button.textContent =
                    "Capture My Location";


                /*
                 * Update count
                 */
                updateSavedCount();

            },


            /*
             * Error
             */
            function(error) {

                let message;


                switch (error.code) {

                    case error.PERMISSION_DENIED:

                        message =
                            "Location permission was denied. Please allow location access in your browser settings.";

                        break;


                    case error.POSITION_UNAVAILABLE:

                        message =
                            "Location is currently unavailable. Try moving to an area with a better GPS signal.";

                        break;


                    case error.TIMEOUT:

                        message =
                            "Location request timed out. Please try again.";

                        break;


                    default:

                        message =
                            "Unable to determine your location.";

                }


                status.textContent =
                    message;

                status.className =
                    "status error";


                button.disabled = false;

                button.textContent =
                    "Try Again";

            },


            /*
             * Location options
             */
            {

                /*
                 * Ask for GPS/high accuracy
                 */
                enableHighAccuracy: true,

                /*
                 * Wait up to 30 seconds
                 */
                timeout: 30000,

                /*
                 * Don't use an old cached position
                 */
                maximumAge: 0

            }

        );

    }


    /*
     * Show saved locations count when page loads
     */
    updateSavedCount();

</script>

</body>
</html>
